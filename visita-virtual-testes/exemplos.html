<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de exemplos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-color: #3b82f6; /* Azul suave */
            --accent-hover: #60a5fa;
            --danger-color: #ef4444;
            --border-radius: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: .5rem 2rem 0 2rem;
        }
        .container {
            width: 100%;
            height: 97vh;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 1rem;
        }
        header h1 {
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }
        header p {
            color: var(--text-secondary);
            font-weight: 300;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }
        button {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 400;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 50px; /* Bordas 100% arredondadas */
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-tour {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-tour:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); /* Leve brilho simulando neon suave */
            transform: translateY(-2px);
        }
        .btn-tour.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        .btn-clear {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--text-secondary);
        }
        .btn-clear:hover {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border-color: var(--danger-color);
        }
        .viewer-container {
            width: 100%;
            flex: 1;
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .empty-state {
            position: absolute;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 300;
        }
        .viewer-container iframe, 
        .viewer-container .virtual-content {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <p>Selecione um exemplo para iniciar</p>
        </header>
        <div class="controls">
            <button class="btn-tour" _360exp_site360="id:viewer-container|model:um_ponto_sem_menu">Modelo: Sem menu - 1 ponto 360° - Frame DIV</button>
            <button class="btn-tour" _360exp_site360="id:viewer-container|model:sem_menu_link_site">Modelo: Sem menu - Com link site - Frame DIV</button>
            <button class="btn-tour" _360exp_site360="id:viewer-container|model:sem_menu_sem_link">Modelo: Sem menu - Sem link site - Frame DIV</button>
            <button class="btn-tour" _360exp_site360="id:viewer-container|model:menu_reduzido">Modelo: Menu reduzido - Frame DIV</button>
            <button class="btn-tour" _360exp_site360>Modelo: Menu completo - Frame tela cheia</button>
        </div>
        <div class="viewer-container" id="viewer-container">
            <div class="empty-state" id="empty-state">
                Frame DIV - Aguardando seleção...
            </div>
        </div>
    </div>
    <script>
        const tourButtons = document.querySelectorAll('.btn-tour');
        const viewerContainer = document.getElementById('viewer-container');
        const emptyStateHTML = `<div class="empty-state">Frame DIV - Aguardando seleção...</div>`;
        function removeActiveClasses() {
            tourButtons.forEach(btn => btn.classList.remove('active'));
        }
        tourButtons.forEach(button => {
            button.addEventListener('click', function() {
                removeActiveClasses();
                this.classList.add('active');
            });
        });
    </script>

    </script>
</body>
</html>
